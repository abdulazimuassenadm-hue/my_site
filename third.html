*{margin:0;padding:0;box-sizing:border-box;font-family:'Amiri',serif}
body{background:var(--bg);color:var(--text);line-height:1.9}
header{background:linear-gradient(135deg,var(--main),var(--main-dark));color:#fff;text-align:center;padding:30px 15px}

main{max-width:820px;margin:24px auto;padding:0 15px}
.card{background:var(--card);border:1px solid #cfe8dc;border-radius:14px;padding:20px;margin:12px 0;box-shadow:0 2px 8px rgba(0,0,0,.05)}
.q-title{font-size:1.35rem;color:var(--main);text-align:center;margin-bottom:12px}
.counter{display:inline-block;background:var(--accent);color:var(--main-dark);border-radius:20px;padding:3px 14px;margin-bottom:8px;font-size:.9rem}
.opt{display:block;background:#e5f0eb;border:1px solid #7fbf9b;padding:10px 14px;margin:8px 0;border-radius:10px;cursor:pointer;font-size:1.05rem;transition:.2s}
.opt:hover{background:#e5f0e0}
.opt.selected{outline:2px solid var(--main);background:#e0f0e0}
.opt.correct{background:#d4edda;border-color:#28a745}
.opt.wrong{background:#f8d7da;border-color:#dc3545}
.btn{background:var(--main);color:#fff;border:0;border-radius:25px;padding:9px 22px;cursor:pointer;font-size:1rem;margin:4px 2px}
.btn:hover{background:var(--main-dark)}
.btn.alt{background:#7fbf9b;color:#3e324f}
.msg{min-height:1.6rem;margin-top:10px;font-size:1.05rem;text-align:center}
.footer{text-align:center;padding:18px;background:#8a7a4f;color:#fff;margin-top:36px}

  html += '<button class="btn" onclick="check()">تحقق</button> ';
  html += '<button class="btn alt" onclick="restart()" style="display:none" id="restartBtn">إعادة</button>';
  html += '</div>';
  html += '<p class="msg" id="msg"></p>';
  box.innerHTML = html;
  document.querySelectorAll('.opt').forEach(e => {
    e.onclick = function(){
      if (answered) return;
      document.querySelectorAll('.opt').forEach(x => x.classList.remove('selected'));
      e.classList.add('selected');
    };
  });
}

function check(){
  const sel = document.querySelector('.opt.selected');
  if (!sel){ alert('اختر إجابة'); return; }
  answered = true;
  const idx = Number(sel.dataset.idx);
  const q = Q[i];
  document.querySelectorAll('.opt').forEach((e, j) => {
    if (j === q.a) e.classList.add('correct');
    if (j === idx && idx !== q.a) e.classList.add('wrong');
  });
  if (idx === q.a){ score++; document.getElementById('msg').textContent = '✅ إجابة صحيحة'; }
  else { document.getElementById('msg').textContent = '❌ الإجابة: ' + q.o[q.a]; }
  const wrap = document.createElement('div');
  wrap.style.textAlign = 'center';
  wrap.style.marginTop = '10px';
  const btn = document.createElement('button');
  btn.className = 'btn';
  btn.textContent = (i+1 < Q.length) ? 'التالي' : 'عرض النتيجة';
  btn.onclick = next;
  wrap.appendChild(btn);
  box.appendChild(wrap);
}

function next(){
  if (++i < Q.length){ render(); }
  else {
    box.innerHTML = '<h3 class="q-title">انتهى الاختبار</h3>'
      + '<p style="text-align:center;font-size:1.4rem;margin:18px 0">النتيجة: ' + score + ' / ' + Q.length + '</p>'
      + '<p style="text-align:center;color:#3a3527;margin-bottom:16px">' + (score >= 50 ? 'ما شاء الله! معرفة جيدة.' : 'تابع الدراسة لزيادة المعرفة.') + '</p>'
      + '<div style="text-align:center"><button class="btn" onclick="restart()">إعادة الاختبار</button> <a class="btn alt" href="index.html" style="display:inline-block;text-decoration:none">الرئيسية</a></div>';
  }
}

function restart(){
  i = 0; score = 0; render();
}

render();
</script>
