<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>أسئلة دينية | قصص الأنبياء</title><style>body{background:#f8f4ea;color:#333;font-family:Amiri,serif;padding:14px}.card{background:#fffdf7;border:1px solid #e8dfc8;border-radius:12px;padding:14px;margin:10px 0}.opt{display:block;background:#efe6d2;border:1px solid #d8c9a3;padding:8px;margin:6px 0;border-radius:9px;cursor:pointer}.opt.selected{outline:2px solid #5c6e58}.small{font-size:.85rem;color:#555}.btn{background:#d8c9a3;border:0;border-radius:25px;padding:8px 18px;cursor:pointer;color:#4a3f28;margin:4px 2px}button:hover{background:#b8a878;color:#fff}</style></head><body><p style="text-align:center;padding:6px"><button onclick="location.href='index.html'" style="background:#d8c9a3;border:0;border-radius:25px;padding:8px 18px;cursor:pointer">‹ رجوع للصفحة principa</button></p><p style="text-align:center;background:#3f4d3e;padding:8px"><a href="index.html" style="color:#d8c9a3;text-decoration:none">‹ رجوع للصفحة الأولى</a></p><h1 style="text-align:center;color:#5c6e58">أسئلة دينية – قصص الأنبياء (اختيار متعدد)</h1><div id="box" class="card"></div><script>
const Q=[
{q:"من هو أول نبي ذُكر في القرآن (بشكل خاص)؟",o:["نوح","آدم","إبراهيم","موسى"],a:1},
{q:"كم عدد الأنبياء المذكورين في القرآن (بالمصطلح (الدقيقة 25)؟",o:["20","25","30","14"],a:1},
{q:"من prophet يُعرف بسجل التجارة and sacrificed son?",o:["إسماعيل","إسحاق","John","Paul"],a:0},
{q:"من بني الكعبة؟",o:["Adam","Noah","جibr","Abraham"],a:3},
{q:"من آتي بالتوراة؟",o:["Moses","David","Jesus","Muhammad"],a:0},
{q:"من بالurgeon children and thrown wells?",o:["Joseph","Jonah","Jesus","Moses"],a:0},
{q:"من expelled from paradise?",o:["Adam","Noah","Satan","Adam & Eve"],a:3},
{q:"من survived whale?",o:["من هو Jonas","Moses","Jesus","Elijah"],a:0},
{q:"من rose to heavens?",o:["Jesus","Elijah","Enoch","Both a,b"],a:3},
{q:"كم صلاة duty in Islam?",o:["4","5","3","2"],a:1}
];
let i=0,score=0;
function render(){
 var q=Q[i];
 var html='<h3>'+q.q+'</h3>';
 q.o.forEach((x,j)=>{ html+='<div class="opt" data-idx="'+j+'">'+x+'</div>'; });
 html+='<button class="btn" onclick="check()">تحقق</button><p class="small" id="msg"></p>';
 document.getElementById('box').innerHTML=html;
 document.querySelectorAll('.opt').forEach(e=>e.onclick=function(){
  document.querySelectorAll('.opt').forEach(x=>x.classList.remove('selected'));
  e.classList.add('selected');
 });
}
function check(){
 var sel=document.querySelector('.opt.selected'); if(!sel){alert('اختر إجابة');return;}
 if (Number(sel.dataset.idx)===Q[i].a){score++;document.getElementById('msg').textContent='✅ 正确';}
 else {document.getElementById('msg').textContent='❌ الإجابة: '+Q[i].o[Q[i].a];}
 var btn=document.createElement('button'); btn.className='btn'; btn.textContent='التالي'; btn.onclick=next; document.getElementById('box').appendChild(btn);
}
function next(){
 if (++i < Q.length){ render(); }
 else { document.getElementById('box').innerHTML='<h3>انتهت! النتيجة: '+score+'/'+Q.length+'</h3>'; }
}
render();
</script></body></html
