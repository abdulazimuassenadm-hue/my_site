<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>أسئلة دينية | قصص الأنبياء — روضة الإيمان</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#6c5b7b">
<link rel="apple-touch-icon" sizes="180x180" href="icon192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@400;600;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --main:#6c5b7b;
  --main-dark:#4e3f5c;
  --accent:#b9a7d1;
  --bg:#f6f4fa;
  --card:#ffffff;
  --text:#2e2a35;
}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Amiri',serif}
body{background:var(--bg);color:var(--text);line-height:1.9}
header{background:linear-gradient(135deg,var(--main),var(--main-dark));color:#fff;text-align:center;padding:30px 15px}
header h1{font-size:2.2rem;color:var(--accent)}
header p{opacity:.9;margin-top:6px}
nav{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;background:var(--main-dark);padding:10px;position:sticky;top:0;z-index:10}
nav button, nav a{background:#b9a7d1;border:1px solid #a993c7;color:#3e324f;padding:8px 18px;border-radius:25px;cursor:pointer;font-size:1rem;text-decoration:none;display:inline-block}
nav button:hover, nav a:hover{background:#9c86bd;color:#fff}
main{max-width:820px;margin:24px auto;padding:0 15px}
.card{background:var(--card);border:1px solid #e5e0ed;border-radius:14px;padding:20px;margin:12px 0;box-shadow:0 2px 8px rgba(0,0,0,.05)}
.q-title{font-size:1.35rem;color:var(--main);text-align:center;margin-bottom:12px}
.counter{display:inline-block;background:var(--accent);color:var(--main-dark);border-radius:20px;padding:3px 14px;margin-bottom:8px;font-size:.9rem}
.opt{display:block;background:#eee8f4;border:1px solid #b9a7d1;padding:10px 14px;margin:8px 0;border-radius:10px;cursor:pointer;font-size:1.05rem;transition:.2s}
.opt:hover{background:#e5dbc0}
.opt.selected{outline:2px solid var(--main);background:#e0f0e0}
.opt.correct{background:#d4edda;border-color:#28a745}
.opt.wrong{background:#f8d7da;border-color:#dc3545}
.btn{background:var(--main);color:#fff;border:0;border-radius:25px;padding:9px 22px;cursor:pointer;font-size:1rem;margin:4px 2px}
.btn:hover{background:var(--main-dark)}
.btn.alt{background:#b9a7d1;color:#3e324f}
.msg{min-height:1.6rem;margin-top:10px;font-size:1.05rem;text-align:center}
.footer{text-align:center;padding:18px;background:var(--main-dark);color:#fff;margin-top:36px}
@media (max-width:600px){header h1{font-size:1.8rem} body{font-size:92%} nav button{padding:6px 12px;font-size:.85rem} main{padding:0 10px} .card{padding:12px} #splash img{width:85%}}
</style>
<script>
(function(){
  var V='7b613d5';
  if(localStorage.getItem('rawdatVer')!==V){
    localStorage.setItem('rawdatVer',V);
    if('serviceWorker' in navigator){
      navigator.serviceWorker.getRegistrations().then(function(regs){regs.forEach(function(r){r.unregister();}); location.reload();});
      return;
    }
    location.reload();
  }
})();
</script>`n</head>
<body>
<header>
  <h1>أسئلة دينية</h1>
  <p>قصص الأنبياء — اختيار من متعدد</p>
</header>
<nav>
  <a href="index.html">الصفحة الرئيسية</a>
  <a href="second.html">الأقسام (صفحة 2)</a>
</nav>
<main>
  <div id="quiz" class="card"></div>
</main>
<footer>
  <p>أسئلة دينية — قصص الأنبياء</p>
</footer>
<script>
const Q = [
  {q:"من هو أول نبي ذُكر في القرآن؟", o:["نوح عليه السلام","آدم عليه السلام","إبراهيم عليه السلام","موسى عليه السلام"], a:1},
  {q:"كم عدد الأنبياء المذكورين بالاسم في القرآن (بدقة)؟", o:["20","25","30","14"], a:1},
  {q:"من هو خليل الله؟", o:["إبراهيم عليه السلام","موسى عليه السلام","عيسى عليه السلام","محمد ﷺ"], a:0},
  {q:"من هو كليم الله؟", o:["موسى عليه السلام","داود عليه السلام","نوح عليه السلام","لوط عليه السلام"], a:0},
  {q:"من هو روح الله؟", o:["عيسى عليه السلام","يحيى عليه السلام","إبراهيم عليه السلام","محمد ﷺ"], a:0},
  {q:"من هو خاتم الأنبياء والمرسلين؟", o:["عيسى عليه السلام","محمد ﷺ","إبراهيم عليه السلام","موسى عليه السلام"], a:1},
  {q:"أيّ نبي ابتلعه الحوت (الحوت) ثم نجّاه الله؟", o:["يونس عليه السلام","موسى عليه السلام","عيسى عليه السلام","إلياس عليه السلام"], a:0},
  {q:"أيّ نبي بنى السفينة بأمر الله؟", o:["نوح عليه السلام","هود عليه السلام","صالح عليه السلام","إبراهيم عليه السلام"], a:0},
  {q:"من هو الذبيح (في المفهوم الإسلامي)؟", o:["إسماعيل عليه السلام","إسحاق عليه السلام","يعقوب عليه السلام","يوسف عليه السلام"], a:0},
  {q:"أيّ نبي ألقي في البئر ثم أصبح عزيز مصر؟", o:["يوسف عليه السلام","يونس عليه السلام","موسى عليه السلام","داود عليه السلام"], a:0},
  {q:"أيّ نبي أُعطي التوراة؟", o:["موسى عليه السلام","داود عليه السلام","عيسى عليه السلام","محمد ﷺ"], a:0},
  {q:"أيّ نبي أُعطي الزبور؟", o:["داود عليه السلام","سليمان عليه السلام","موسى عليه السلام","عيسى عليه السلام"], a:0},
  {q:"أيّ نبي أُعطي الإنجيل؟", o:["عيسى عليه السلام","يحيى عليه السلام","زكريا عليه السلام","محمد ﷺ"], a:0},
  {q:"أيّ نبي أُنزل عليه القرآن؟", o:["محمد ﷺ","عيسى عليه السلام","موسى عليه السلام","إبراهيم عليه السلام"], a:0},
  {q:"أيّ نبي أرسل إلى قوم ثمود (ناقة)؟", o:["صالح عليه السلام","هود عليه السلام","لوط عليه السلام","شعيب عليه السلام"], a:0},
  {q:"أيّ نبي أرسل إلى قوم عاد؟", o:["هود عليه السلام","صالح عليه السلام","نوح عليه السلام","شعيب عليه السلام"], a:0},
  {q:"أيّ نبي أرسل إلى أهل مدين؟", o:["شعيب عليه السلام","لوط عليه السلام","هود عليه السلام","صالح عليه السلام"], a:0},
  {q:"أيّ نبي شقّ له البحر؟", o:["موسى عليه السلام","عيسى عليه السلام","إبراهيم عليه السلام","نوح عليه السلام"], a:0},
  {q:"أيّ نبي وُلد من غير أب (بروح الله)؟", o:["عيسى عليه السلام","آدم عليه السلام","يحيى عليه السلام","إدريس عليه السلام"], a:0},
  {q:"أيّ نبي رفعه الله إلى السماء (بإذنه)؟", o:["عيسى عليه السلام","إدريس عليه السلام","إلياس عليه السلام","محمد ﷺ"], a:0},
  {q:"أيّ نبي هو أول من خطّ بالقلم؟", o:["إدريس عليه السلام","نوح عليه السلام","إبراهيم عليه السلام","موسى عليه السلام"], a:0}
];

let i=0, score=0, answered=false;
const box = document.getElementById('quiz');

function render(){
  answered = false;
  const q = Q[i];
  let html = '';
  html += '<div class="counter">سؤال ' + (i+1) + ' من ' + Q.length + '</div>';
  html += '<h3 class="q-title">' + q.q + '</h3>';
  q.o.forEach((x,j) => {
    html += '<div class="opt" data-idx="' + j + '">' + x + '</div>';
  });
  html += '<div style="text-align:center;margin-top:12px">';
  html += '<button class="btn" onclick="check()">تحقق</button> ';
  html += '<button class="btn alt" onclick="restart()" style="display:none" id="restartBtn">إعادة</button>';
  html += '</div>';
  html += '<p class="msg" id="msg"></p>';
  box.innerHTML = html;
  document.querySelectorAll('.opt').forEach(e => {
    e.onclick = function(){
      if (answered) return;
      document.querySelectorAll('.opt').forEach(x => x.classList.remove('selected'));
      e.classList.add('selected');
    };
  });
}

function check(){
  const sel = document.querySelector('.opt.selected');
  if (!sel){ alert('اختر إجابة'); return; }
  answered = true;
  const idx = Number(sel.dataset.idx);
  const q = Q[i];
  document.querySelectorAll('.opt').forEach((e, j) => {
    if (j === q.a) e.classList.add('correct');
    if (j === idx && idx !== q.a) e.classList.add('wrong');
  });
  if (idx === q.a){ score++; document.getElementById('msg').textContent = '✅ إجابة صحيحة'; }
  else { document.getElementById('msg').textContent = '❌ الإجابة: ' + q.o[q.a]; }
  const wrap = document.createElement('div');
  wrap.style.textAlign = 'center';
  wrap.style.marginTop = '10px';
  const btn = document.createElement('button');
  btn.className = 'btn';
  btn.textContent = (i+1 < Q.length) ? 'التالي' : 'عرض النتيجة';
  btn.onclick = next;
  wrap.appendChild(btn);
  box.appendChild(wrap);
}

function next(){
  if (++i < Q.length){ render(); }
  else {
    box.innerHTML = '<h3 class="q-title">انتهى الاختبار</h3>'
      + '<p style="text-align:center;font-size:1.4rem;margin:18px 0">النتيجة: ' + score + ' / ' + Q.length + '</p>'
      + '<p style="text-align:center;color:#5a5366;margin-bottom:16px">' + (score >= 15 ? 'ما شاء الله! معرفة جيدة لقصص الأنبياء.' : 'تابع دراسة قصص الأنبياء لزيادة المعرفة.') + '</p>'
      + '<div style="text-align:center"><button class="btn" onclick="restart()">إعادة الاختبار</button> <a class="btn alt" href="index.html" style="display:inline-block;text-decoration:none">الرئيسية</a></div>';
  }
}

function restart(){
  i = 0; score = 0; render();
}

render();
<script>
if('serviceWorker' in navigator && location.hostname === 'abdulazimuassenadm-hue.github.io'){ navigator.serviceWorker.register('sw.js', { scope: '/my_site/' }); }
</script>
</body>
</html>
